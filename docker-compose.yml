services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: competitive-pokemon-postgres:18
    container_name: competitive-pokemon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-pokemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bind to localhost only. Use 0.0.0.0 if other machines must connect.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker as PGDATA.
      # Mount the parent so the volume stays valid across major upgrades.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256mb

volumes:
  postgres_data:
